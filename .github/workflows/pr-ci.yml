name: Organization profile

on: pull_request

permissions:
  contents: read

jobs:
  profile:
    name: PR CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check profile/README.md contains text
        run: grep -Iq '[^[:space:]]' profile/README.md
